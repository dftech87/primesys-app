<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrimeSys | Login</title>
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png" />
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; align-items: center; justify-content: center;
            background: #ffffff; color: #0f172a;
        }
        .card {
            width: min(100%, 380px); background: #fff; border-radius: 16px;
            padding: 32px 28px;
        }
        .logo { display: block; width: 88px; height: 88px; margin: 0 auto 20px; }
        h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
        p.sub { margin: 0 0 24px; color: #64748b; font-size: 14px; text-align: center; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
        input {
            width: 100%; border: 1px solid #cbd5e1; border-radius: 10px;
            padding: 12px 14px; font-size: 14px; margin-bottom: 16px;
        }
        button {
            width: 100%; border: 0; border-radius: 10px; padding: 12px 16px;
            font-size: 14px; font-weight: 700; color: #fff; background: #0f172a; cursor: pointer;
        }
        .error {
            margin-bottom: 16px; padding: 10px 12px; border-radius: 10px;
            background: #fee2e2; color: #991b1b; font-size: 13px;
        }
        .empresa-salva {
            display: none; align-items: center; justify-content: space-between;
            margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; background: #f1f5f9;
            font-size: 13px;
        }
        .empresa-salva button {
            width: auto; background: none; color: #0b3895; font-weight: 700; padding: 0;
            text-decoration: underline; cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="/static/icons/icon-192.png" alt="PrimeSys" />
        <h1>PrimeSys Info</h1>
        <p class="sub">Entre com o CNPJ da empresa e o seu usuário e senha do Meu ERP Online.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="empresa-salva" id="empresaSalva">
            <span>CNPJ: <b id="empresaSalvaCnpj"></b></span>
            <button type="button" id="btnTrocarCnpj">Trocar</button>
        </div>
        <form method="post" action="/login" id="formLogin">
            <input type="hidden" name="next" value="{{ next }}" />
            <div id="campoCnpj">
                <label for="cnpj">CNPJ da empresa</label>
                <input id="cnpj" name="cnpj" type="text" inputmode="numeric" autocomplete="off" required autofocus />
            </div>
            <label for="email">E-mail (usuário do ERP)</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required />
            <button type="submit">Entrar</button>
        </form>
    </main>
    <script>
        // Lembra o CNPJ no aparelho (não sai daqui) depois do primeiro login, pra
        // quem sempre acessa a mesma empresa não precisar redigitar toda vez.
        const CHAVE_CNPJ = 'primesys_cnpj';
        const elCampoCnpj = document.getElementById('campoCnpj');
        const elCnpj = document.getElementById('cnpj');
        const elEmpresaSalva = document.getElementById('empresaSalva');
        const elEmpresaSalvaCnpj = document.getElementById('empresaSalvaCnpj');
        const elEmail = document.getElementById('email');
        const elFormLogin = document.getElementById('formLogin');

        function formatarCnpj(cnpj) {
            const d = (cnpj || '').replace(/\D/g, '');
            if (d.length !== 14) return cnpj;
            return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12,14)}`;
        }

        function usarCnpjSalvo(cnpj) {
            elCnpj.value = cnpj;
            elCnpj.required = false;
            elCampoCnpj.style.display = 'none';
            elEmpresaSalvaCnpj.textContent = formatarCnpj(cnpj);
            elEmpresaSalva.style.display = 'flex';
            elEmail.focus();
        }

        function mostrarCampoCnpj() {
            elCnpj.value = '';
            elCnpj.required = true;
            elCampoCnpj.style.display = 'block';
            elEmpresaSalva.style.display = 'none';
            elCnpj.focus();
        }

        try {
            const salvo = localStorage.getItem(CHAVE_CNPJ);
            if (salvo) usarCnpjSalvo(salvo);
        } catch (err) { /* localStorage indisponível — segue com o campo normal */ }

        document.getElementById('btnTrocarCnpj').addEventListener('click', () => {
            try { localStorage.removeItem(CHAVE_CNPJ); } catch (err) {}
            mostrarCampoCnpj();
        });

        elFormLogin.addEventListener('submit', () => {
            try { localStorage.setItem(CHAVE_CNPJ, elCnpj.value); } catch (err) {}
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
