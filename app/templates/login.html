<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrimeSys | Login</title>
    <meta name="theme-color" content="#0b3895" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png" />
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e293b); color: #0f172a;
        }
        .card {
            width: min(100%, 380px); background: #fff; border-radius: 16px;
            padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }
        h1 { margin: 0 0 4px; font-size: 22px; }
        p.sub { margin: 0 0 24px; color: #64748b; font-size: 14px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
        input {
            width: 100%; border: 1px solid #cbd5e1; border-radius: 10px;
            padding: 12px 14px; font-size: 14px; margin-bottom: 16px;
        }
        button {
            width: 100%; border: 0; border-radius: 10px; padding: 12px 16px;
            font-size: 14px; font-weight: 700; color: #fff; background: #0f172a; cursor: pointer;
        }
        .error {
            margin-bottom: 16px; padding: 10px 12px; border-radius: 10px;
            background: #fee2e2; color: #991b1b; font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>PrimeSys Info</h1>
        <p class="sub">Entre com o CNPJ da empresa e o seu usuário e senha do Meu ERP Online.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next }}" />
            <label for="cnpj">CNPJ da empresa</label>
            <input id="cnpj" name="cnpj" type="text" inputmode="numeric" autocomplete="off" required autofocus />
            <label for="email">E-mail (usuário do ERP)</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required />
            <button type="submit">Entrar</button>
        </form>
    </main>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
